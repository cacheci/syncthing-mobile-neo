name: Alpha Preview

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Alpha Preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: alpha-preview-release
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-37.2
            ndk;28.2.13676358

      - name: Select Android NDK 28.2
        run: |
          ndk_path="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          if [[ ! -f "$ndk_path/source.properties" ]]; then
            echo "Android NDK 28.2.13676358 was not installed at $ndk_path." >&2
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_path" >> "$GITHUB_ENV"

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64_DBG: ${{ secrets.ANDROID_KEYSTORE_BASE64_DBG }}
          KEYSTORE_PASS_DBG: ${{ secrets.KEYSTORE_PASS_DBG }}
          KEY_ALIAS_DBG: ${{ secrets.KEY_ALIAS_DBG }}
          KEY_PASSWORD_DBG: ${{ secrets.KEY_PASSWORD_DBG }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64_DBG KEYSTORE_PASS_DBG KEY_ALIAS_DBG KEY_PASSWORD_DBG; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64_DBG" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS_DBG }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS_DBG }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_DBG }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Locate release APK
        id: apk
        run: |
          mapfile -t apks < <(
            find androidApp/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              | sort
          )

          if (( ${#apks[@]} == 0 )); then
            echo "No APK files found in androidApp/build/outputs/apk/release" >&2
            exit 1
          fi

          {
            echo "apk_paths<<EOF"
            printf '%s\n' "${apks[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "apk_names<<EOF"
            for apk in "${apks[@]}"; do
              basename "$apk"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Alpha Preview release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATHS: ${{ steps.apk.outputs.apk_paths }}
          APK_NAMES: ${{ steps.apk.outputs.apk_names }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          tag="alpha-preview"

          mapfile -t apk_paths <<< "$APK_PATHS"
          mapfile -t apk_names <<< "$APK_NAMES"

          previous_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" \
              --jq '.object.sha' \
              2>/dev/null || true
          )"
          existing_release_body="$(
            gh release view "$tag" --json body --jq '.body' 2>/dev/null || true
          )"
          release_sha="$(
            printf '%s\n' "$existing_release_body" \
              | sed -n 's/^Automated Alpha Preview build for commit \([0-9a-f]\{40\}\)\.$/\1/p' \
              | head -n 1
          )"
          baseline_sha="${release_sha:-$previous_sha}"

          if [[ -n "$baseline_sha" ]] && git cat-file -e "${baseline_sha}^{commit}" 2>/dev/null; then
            raw_commit_messages="$(
              git log "${baseline_sha}..${GITHUB_SHA}" --reverse --format='%s'
            )"
          else
            raw_commit_messages="$(git log -1 "$GITHUB_SHA" --format='%s')"
          fi

          commit_messages="$(
            printf '%s\n' "$raw_commit_messages" \
              | grep -Eiv '^(chore|wkfl|deps)' \
              | sed 's/^/- /' \
              || true
          )"

          if [[ "$release_sha" == "$GITHUB_SHA" ]] && [[ -n "$existing_release_body" ]]; then
            release_notes="$existing_release_body"
          else
            release_notes="Automated Alpha Preview build for commit $GITHUB_SHA.

          $commit_messages

          > [!WARNING]
          > Please note that the preview release is unstable and is signed with the AOSP test key. Since the test key is publicly available, anyone can generate and sign an APK with the same key, and such APKs may be installed without triggering a signature-related warning."
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${apk_paths[@]}" --clobber

            mapfile -t obsolete_apks < <(
              gh release view "$tag" \
                --json assets \
                --jq '.assets[].name | select(endswith(".apk"))'
            )
            for obsolete_apk in "${obsolete_apks[@]}"; do
              keep=false
              for name in "${apk_names[@]}"; do
                if [[ "$obsolete_apk" == "$name" ]]; then
                  keep=true
                  break
                fi
              done
              if [[ "$keep" == false ]]; then
                gh release delete-asset "$tag" "$obsolete_apk" --yes
              fi
            done

            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --title "Alpha Preview $short_sha" \
              --notes "$release_notes" \
              --prerelease \
              --draft=false \
              --latest=false
          else
            gh release create "$tag" "${apk_paths[@]}" \
              --target "$GITHUB_SHA" \
              --title "Alpha Preview $short_sha" \
              --notes "$release_notes" \
              --prerelease \
              --latest=false
          fi

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/$tag" \
            -f "sha=$GITHUB_SHA" \
            -F force=true \
            >/dev/null

          commit_messages_b64="$(printf '%s' "$commit_messages" | base64 -w 0)"
          echo "commit_messages_b64=$commit_messages_b64" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Upload Alpha Preview to Telegram
        if: steps.release.outputs.published == 'true'
        env:
          APK_PATHS: ${{ steps.apk.outputs.apk_paths }}
          COMMIT_MESSAGES_B64: ${{ steps.release.outputs.commit_messages_b64 }}
          TELEGRAM_BOT_API: ${{ secrets.TELEGRAM_BOT_API }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REPLY_TO_MESSAGE_ID: ${{ secrets.TELEGRAM_REPLY_TO_MESSAGE_ID }}
        run: |
          missing=()
          for name in TELEGRAM_BOT_API TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_REPLY_TO_MESSAGE_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

          TELEGRAM_BOT_API="${TELEGRAM_BOT_API%/}"
          if [[ ! "$TELEGRAM_BOT_API" =~ ^https?://[^[:space:]]+/bot$ ]]; then
            echo "TELEGRAM_BOT_API must use the format https://example.com/bot." >&2
            exit 1
          fi

          if [[ ! "$TELEGRAM_REPLY_TO_MESSAGE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "TELEGRAM_REPLY_TO_MESSAGE_ID must be a positive integer." >&2
            exit 1
          fi

          mapfile -t apk_paths <<< "$APK_PATHS"

          eligible_apks=()
          for apk_path in "${apk_paths[@]}"; do
            if [[ ! -f "$apk_path" ]]; then
              echo "APK file does not exist: $apk_path" >&2
              exit 1
            fi

            size="$(stat -c '%s' "$apk_path")"
            if (( size > 50*1024*1024 )); then
              echo "::warning file=$apk_path::Skipping APK larger than Telegram's 50 MB upload limit."
              continue
            fi
            eligible_apks+=("$apk_path")
          done

          apk_count="${#eligible_apks[@]}"
          if (( apk_count == 0 )); then
            echo "No APK files are eligible for Telegram upload." >&2
            exit 1
          fi
          if (( apk_count > 10 )); then
            echo "Telegram media groups support at most 10 files; found $apk_count." >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA:0:12}"
          reply_parameters="$(
            jq -cn \
              --argjson message_id "$TELEGRAM_REPLY_TO_MESSAGE_ID" \
              '{message_id: $message_id}'
          )"
          commit_messages="$(printf '%s' "$COMMIT_MESSAGES_B64" | base64 --decode)"
          caption_prefix="Alpha Preview $short_sha

          Changes
          "
          warning="⚠️ Please note that the preview release is unstable and is signed with the AOSP test key. Since the test key is publicly available, anyone can generate and sign an APK with the same key, and such APKs may be installed without triggering a signature-related warning."
          caption_suffix=$'\n\n'"$warning"

          max_caption_length=1000
          max_commit_length=$((
            max_caption_length - ${#caption_prefix} - ${#caption_suffix}
          ))
          truncation_marker=$'\n… (additional commits omitted)'
          if (( ${#commit_messages} > max_commit_length )); then
            truncated_length=$((max_commit_length - ${#truncation_marker}))
            commit_messages="${commit_messages:0:truncated_length}${truncation_marker}"
          fi

          escape_markdown_v2() {
            sed \
              -e 's/\\/\\\\/g' \
              -e 's/[][()~`>#+=|{}.!_*-]/\\&/g'
          }

          escaped_commit_messages="$(
            printf '%s' "$commit_messages" | escape_markdown_v2
          )"
          escaped_warning="$(
            printf '%s' "$warning" | escape_markdown_v2
          )"
          telegram_caption="*Alpha Preview* \`$short_sha\`

          *Changes*
          $escaped_commit_messages

          $escaped_warning"

          verify_telegram_response() {
            local response="$1"
            if ! jq -e '.ok == true' >/dev/null <<< "$response"; then
              echo "Telegram API returned an unsuccessful response: $response" >&2
              return 1
            fi
          }

          if (( apk_count == 1 )); then
            response="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --retry 3 \
                --form-string "chat_id=$TELEGRAM_CHAT_ID" \
                --form "document=@${eligible_apks[0]}" \
                --form-string "caption=$telegram_caption" \
                --form-string "parse_mode=MarkdownV2" \
                --form-string "reply_parameters=$reply_parameters" \
                "${TELEGRAM_BOT_API}${TELEGRAM_BOT_TOKEN}/sendDocument"
            )"
          else
            args=(
              --silent
              --show-error
              --fail-with-body
              --retry 3
              --form-string "chat_id=$TELEGRAM_CHAT_ID"
              --form-string "reply_parameters=$reply_parameters"
            )

            media_json='['
            for (( i=0; i<apk_count; i++ )); do
              apk_path="${eligible_apks[$i]}"
              args+=(--form "file$i=@$apk_path")
              if (( i == 0 )); then
                media_json+="{\"type\":\"document\",\"media\":\"attach://file$i\",\"caption\":$(printf '%s' "$telegram_caption" | jq -Rs .),\"parse_mode\":\"MarkdownV2\"},"
              else
                media_json+="{\"type\":\"document\",\"media\":\"attach://file$i\"},"
              fi
            done

            media_json="${media_json%,}]"
            args+=(--form-string "media=$media_json")
            response="$(
              curl \
                "${args[@]}" \
                "${TELEGRAM_BOT_API}${TELEGRAM_BOT_TOKEN}/sendMediaGroup"
            )"
          fi

          verify_telegram_response "$response"
