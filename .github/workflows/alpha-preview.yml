name: Alpha Preview

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Alpha Preview
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.2" \
            "ndk;28.2.13676358"

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64_DBG: ${{ secrets.ANDROID_KEYSTORE_BASE64_DBG }}
          KEYSTORE_PASS_DBG: ${{ secrets.KEYSTORE_PASS_DBG }}
          KEY_ALIAS_DBG: ${{ secrets.KEY_ALIAS_DBG }}
          KEY_PASSWORD_DBG: ${{ secrets.KEY_PASSWORD_DBG }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64_DBG KEYSTORE_PASS_DBG KEY_ALIAS_DBG KEY_PASSWORD_DBG; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64_DBG" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS_DBG }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS_DBG }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_DBG }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Locate release APK
        id: apk
        run: |
          mapfile -t apks < <(
            find androidApp/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print
          )

          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one release APK, found ${#apks[@]}." >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi

          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish Alpha Preview release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          tag="alpha-preview-$short_sha"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi

          gh release create "$tag" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "Alpha Preview $short_sha" \
            --notes "Automated Alpha Preview build for commit $GITHUB_SHA." \
            --prerelease \
            --latest=false
